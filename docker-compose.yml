services:
  fem2d:
    build:
      context: .
      dockerfile: Dockerfile
    image: fem2d-teaching:latest
    container_name: fem2d
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WEB_DIST=/app/web/dist
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
